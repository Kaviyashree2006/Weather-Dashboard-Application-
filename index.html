<!DOCTYPE html>
<html>
<head>
    <title>Weather Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #74ebd5, #9face6);
        }

        .container {
            width: 400px;
            padding: 30px;
            text-align: center;

            background: rgba(255, 255, 255, 0.95);
            border-radius: 25px;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #4b3f72;
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        input {
            flex: 1;
            padding: 12px;

            border: 2px solid #9face6;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #6c5ce7;
        }

        button {
            padding: 12px 18px;

            border: none;
            border-radius: 10px;

            background: #6c5ce7;
            color: white;

            font-size: 15px;
            cursor: pointer;
        }

        button:hover {
            background: #4834d4;
        }

        #weather {
            padding: 20px;

            background: linear-gradient(135deg, #a8edea, #fed6e3);

            border-radius: 20px;

            min-height: 150px;
        }

        #weather h2 {
            color: #2d3436;
        }

        .weather-item {
            margin: 12px 0;
            padding: 10px;

            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;

            color: #2d3436;
            font-size: 16px;
        }

        .error {
            color: #d63031;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather Dashboard</h1>

        <div class="search-box">
            <input
                type="text"
                id="city"
                placeholder="Enter city name"
            >

            <button onclick="getWeather()">Search</button>
        </div>

        <div id="weather">
            <p>🌍 Enter a city to check the weather</p>
        </div>

    </div>

    <script src="samplescript.js"></script>

</body>
</html>
